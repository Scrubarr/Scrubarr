name: Docker image

on:
  push:
    tags:
      - "v*.*.*"
      - "rc-v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image for compatibility testing
        required: true
        default: ubuntu-24.04
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-26.04
      docker_smoke:
        description: Build and health-check the Docker image without publishing it
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-24.04' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run server tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Run UI smoke test
        run: npm run test:ui

      - name: Run browser regression test
        run: npm run test:ui:browser

      - name: Check release metadata
        run: npm run release:check

  docker:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'ubuntu-24.04' }}
    needs: checks
    permissions:
      contents: write
      packages: write
    if: >-
      (github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/rc-v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.docker_smoke)
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare candidate or release image tags
        id: image
        run: |
          version="$(node -p "require('./package.json').version")"
          image="ghcr.io/scrubarr/scrubarr"
          if [ "$GITHUB_REF_NAME" = "v$version" ]; then
            reference="$image:v$version"
            {
              echo 'tags<<EOF'
              echo "$image:latest"
              echo "$reference"
              echo 'EOF'
              echo "reference=$reference"
              echo "kind=release"
            } >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "rc-v$version" ]; then
            reference="$image:rc-v$version"
            {
              echo 'tags<<EOF'
              echo "$reference"
              echo 'EOF'
              echo "reference=$reference"
              echo "kind=release-candidate"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            reference="scrubarr:workflow-smoke"
            {
              echo "tags=$reference"
              echo "reference=$reference"
              echo "kind=workflow-smoke"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Tag must be v$version or rc-v$version" >&2
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: ${{ github.event_name == 'workflow_dispatch' }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.image.outputs.tags }}

      - name: Smoke test Docker image
        if: steps.image.outputs.kind == 'workflow-smoke'
        run: |
          container_id="$(docker run --detach --publish 18098:8098 "${{ steps.image.outputs.reference }}")"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18098/api/health > health.json; then
              break
            fi
            sleep 2
          done

          node -e '
            const health = require("./health.json");
            if (health.status !== "ok") {
              throw new Error(`Unexpected health status: ${health.status}`);
            }
          '

      - name: Record published immutable image digest
        if: github.event_name == 'push'
        run: |
          {
            echo "## Published Scrubarr ${{ steps.image.outputs.kind }} image"
            echo
            echo "\`${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Use this digest when signing the official update manifest after a final release."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare GitHub release notes
        if: steps.image.outputs.kind == 'release'
        run: |
          version="$(node -p "require('./package.json').version")"
          awk -v heading="## $version" '
            $0 == heading { collecting = 1; next }
            collecting && /^## / { exit }
            collecting { print }
            END { if (!collecting) exit 2 }
          ' CHANGELOG.md > release-notes.md

          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no release notes for version $version" >&2
            exit 1
          fi

      - name: Create GitHub release
        if: steps.image.outputs.kind == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "GitHub release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Scrubarr $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
