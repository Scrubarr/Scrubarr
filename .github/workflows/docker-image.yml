name: Docker image

on:
  push:
    tags:
      - "v*.*.*"
      - "rc-v*.*.*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run server tests
        run: npm test

      - name: Build client
        run: npm run build

      - name: Run UI smoke test
        run: npm run test:ui

      - name: Run browser regression test
        run: npm run test:ui:browser

      - name: Check release metadata
        run: npm run release:check

  docker:
    runs-on: ubuntu-latest
    needs: checks
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/rc-v'))
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare candidate or release image tags
        id: image
        run: |
          version="$(node -p "require('./package.json').version")"
          image="ghcr.io/scrubarr/scrubarr"
          if [ "$GITHUB_REF_NAME" = "v$version" ]; then
            reference="$image:v$version"
            {
              echo 'tags<<EOF'
              echo "$image:latest"
              echo "$reference"
              echo 'EOF'
              echo "reference=$reference"
              echo "kind=release"
            } >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "rc-v$version" ]; then
            reference="$image:rc-v$version"
            {
              echo 'tags<<EOF'
              echo "$reference"
              echo 'EOF'
              echo "reference=$reference"
              echo "kind=release-candidate"
            } >> "$GITHUB_OUTPUT"
          else
            echo "Tag must be v$version or rc-v$version" >&2
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.tags }}

      - name: Record published immutable image digest
        run: |
          {
            echo "## Published Scrubarr ${{ steps.image.outputs.kind }} image"
            echo
            echo "\`${{ steps.image.outputs.reference }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo "Use this digest when signing the official update manifest after a final release."
          } >> "$GITHUB_STEP_SUMMARY"
